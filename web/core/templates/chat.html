<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chat — {{ banco }} — IA SQL BD</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Segoe UI', system-ui, sans-serif;
    background: #0f1117; color: #e2e8f0;
    display: grid;
    grid-template-columns: 220px 1fr;
    grid-template-rows: 52px 1fr;
    height: 100vh; overflow: hidden;
  }

  /* Topbar */
  header {
    grid-column: 1 / -1;
    background: #1a1d27;
    border-bottom: 1px solid #2d3148;
    display: flex; align-items: center;
    padding: 0 1.5rem; gap: 1rem;
    font-size: 0.9rem;
  }
  header .title { font-weight: 700; color: #7c8cf8; flex: 1; }
  header a { color: #7c8cf8; text-decoration: none; font-size: 0.82rem; }
  header span { color: #64748b; }

  /* Sidebar */
  aside {
    background: #13151f;
    border-right: 1px solid #2d3148;
    overflow-y: auto; padding: 1rem 0.8rem;
    font-size: 0.8rem;
  }
  aside h3 { color: #64748b; font-size: 0.72rem; text-transform: uppercase;
             letter-spacing: 0.08em; margin-bottom: 0.7rem; padding: 0 0.4rem; }
  .tabela-item { margin-bottom: 0.6rem; }
  .tabela-nome {
    color: #c4b5fd; font-weight: 600; padding: 0.3rem 0.4rem;
    border-radius: 5px; cursor: pointer;
    display: flex; justify-content: space-between; align-items: center;
  }
  .tabela-nome:hover { background: #1e2238; }
  .cols-lista { padding: 0.2rem 0.4rem 0  1rem; display: none; }
  .cols-lista.aberta { display: block; }
  .col-tag {
    display: inline-block; background: #1e2238; color: #94a3b8;
    padding: 0.15rem 0.5rem; border-radius: 4px; margin: 0.15rem 0.1rem;
    font-size: 0.72rem;
  }

  /* Main chat */
  main {
    display: flex; flex-direction: column; overflow: hidden;
  }

  #historico {
    flex: 1; overflow-y: auto; padding: 1.5rem;
    display: flex; flex-direction: column; gap: 1rem;
  }

  .msg { max-width: 80%; }
  .msg.usuario { align-self: flex-end; }
  .msg.ia      { align-self: flex-start; }

  .msg-balao {
    padding: 0.7rem 1rem; border-radius: 10px; font-size: 0.9rem; line-height: 1.5;
  }
  .msg.usuario .msg-balao { background: #2d3a6e; color: #e2e8f0; }
  .msg.ia      .msg-balao { background: #1a1d27; border: 1px solid #2d3148; color: #cbd5e1; }

  .sql-bloco {
    margin-top: 0.5rem;
    background: #0f1117; border: 1px solid #2d3148;
    border-radius: 6px; padding: 0.6rem 0.8rem;
    font-family: monospace; font-size: 0.78rem; color: #7dd3fc;
    white-space: pre-wrap; word-break: break-word;
  }

  .tabela-resultado {
    margin-top: 0.6rem; width: 100%;
    border-collapse: collapse; font-size: 0.8rem;
  }
  .tabela-resultado th {
    background: #1e2238; color: #7c8cf8;
    padding: 0.4rem 0.7rem; text-align: left;
    border-bottom: 1px solid #2d3148;
  }
  .tabela-resultado td {
    padding: 0.35rem 0.7rem; border-bottom: 1px solid #1e2238; color: #cbd5e1;
  }
  .tabela-resultado tr:hover td { background: #1e2238; }

  /* Input */
  .input-area {
    padding: 1rem 1.5rem;
    border-top: 1px solid #2d3148;
    background: #1a1d27;
    display: flex; gap: 0.7rem;
  }
  .input-area input {
    flex: 1; padding: 0.65rem 1rem;
    background: #0f1117; border: 1px solid #2d3148;
    border-radius: 8px; color: #e2e8f0; font-size: 0.95rem; outline: none;
    transition: border-color 0.2s;
  }
  .input-area input:focus { border-color: #7c8cf8; }
  .input-area button {
    padding: 0.65rem 1.3rem;
    background: #7c8cf8; color: #fff; border: none;
    border-radius: 8px; font-weight: 600; cursor: pointer;
    transition: background 0.2s;
  }
  .input-area button:hover { background: #6470e8; }
  .input-area button:disabled { background: #2d3148; cursor: not-allowed; }

  .spinner { display: inline-block; width: 14px; height: 14px;
    border: 2px solid #2d3148; border-top-color: #7c8cf8;
    border-radius: 50%; animation: spin 0.7s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>

<header>
  <span class="title">IA SQL BD</span>
  <span>🗄 {{ banco }}</span>
  <a href="/">trocar banco</a>
  {% if usuario.is_admin %}<a href="/admin/">⚙ admin</a>{% endif %}
  <span>|</span>
  <span>{{ usuario.username }}{% if usuario.cargo_nome %} · {{ usuario.cargo_nome }}{% endif %}</span>
  <a href="/logout/">sair</a>
</header>

<aside>
  <h3>Visível para você</h3>
  {% for tabela in tabelas_visiveis %}
  <div class="tabela-item">
    <div class="tabela-nome" onclick="toggleCols(this)">
      {{ tabela }} <span>▾</span>
    </div>
    <div class="cols-lista" id="cols-{{ tabela }}">
      <div id="cols-tags-{{ tabela }}"></div>
    </div>
  </div>
  {% endfor %}
</aside>

<main>
  <div id="historico"></div>
  <div class="input-area">
    <input id="pergunta" type="text" placeholder="Faça uma pergunta sobre o banco..." autocomplete="off">
    <button id="btn-enviar" onclick="enviar()">Enviar</button>
  </div>
</main>

<script>
const colunasVisiveis = {{ colunas_visiveis|safe }};

// Preenche colunas na sidebar
Object.entries(colunasVisiveis).forEach(([tabela, cols]) => {
  const el = document.getElementById(`cols-tags-${tabela}`);
  if (el) el.innerHTML = cols.map(c => `<span class="col-tag">${c}</span>`).join('');
});

function toggleCols(el) {
  const id = el.nextElementSibling;
  id.classList.toggle('aberta');
  el.querySelector('span').textContent = id.classList.contains('aberta') ? '▴' : '▾';
}

const historico = document.getElementById('historico');
const input     = document.getElementById('pergunta');
const btn       = document.getElementById('btn-enviar');

function adicionarMsg(tipo, html) {
  const div = document.createElement('div');
  div.className = `msg ${tipo}`;
  div.innerHTML = `<div class="msg-balao">${html}</div>`;
  historico.appendChild(div);
  historico.scrollTop = historico.scrollHeight;
  return div;
}

function construirTabela(colunas, linhas) {
  if (!linhas.length) return '<em>Nenhum resultado.</em>';
  const ths = colunas.map(c => `<th>${c}</th>`).join('');
  const trs = linhas.map(l => '<tr>' + l.map(v => `<td>${v ?? ''}</td>`).join('') + '</tr>').join('');
  return `<table class="tabela-resultado"><thead><tr>${ths}</tr></thead><tbody>${trs}</tbody></table>`;
}

async function enviar() {
  const pergunta = input.value.trim();
  if (!pergunta) return;

  input.value = '';
  btn.disabled = true;

  adicionarMsg('usuario', pergunta);

  const loadDiv = adicionarMsg('ia', '<span class="spinner"></span> Processando...');

  try {
    const resp = await fetch('/chat/query/', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'X-CSRFToken': getCookie('csrftoken'),
      },
      body: JSON.stringify({ pergunta }),
    });

    const data = await resp.json();

    if (data.erro) {
      loadDiv.querySelector('.msg-balao').innerHTML = `<span style="color:#f87171">Erro: ${data.erro}</span>`;
    } else {
      const tabela = construirTabela(data.colunas, data.linhas);
      loadDiv.querySelector('.msg-balao').innerHTML =
        `${data.resposta}
         <div class="sql-bloco">${data.sql}</div>
         ${data.linhas.length > 1 ? tabela : ''}`;
    }
  } catch (e) {
    loadDiv.querySelector('.msg-balao').innerHTML = `<span style="color:#f87171">Erro de conexão.</span>`;
  }

  btn.disabled = false;
  input.focus();
}

input.addEventListener('keydown', e => { if (e.key === 'Enter') enviar(); });

function getCookie(name) {
  const v = document.cookie.match('(^|;)\\s*' + name + '\\s*=\\s*([^;]+)');
  return v ? v.pop() : '';
}
</script>
</body>
</html>
