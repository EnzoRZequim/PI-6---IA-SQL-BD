<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Selecionar Banco — IA SQL BD</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Segoe UI', system-ui, sans-serif;
    background: #0f1117; color: #e2e8f0;
    min-height: 100vh; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 2rem;
  }
  h2 { font-size: 1.3rem; color: #94a3b8; }
  .cards { display: flex; gap: 1.2rem; flex-wrap: wrap; justify-content: center; }
  .banco-card {
    background: #1a1d27; border: 1px solid #2d3148;
    border-radius: 12px; padding: 2rem 2.5rem;
    text-align: center; text-decoration: none; color: #e2e8f0;
    font-size: 1.1rem; font-weight: 600;
    transition: border-color 0.2s, background 0.2s;
  }
  .banco-card:hover { border-color: #7c8cf8; background: #1e2238; }
  .banco-card span { display: block; font-size: 2rem; margin-bottom: 0.6rem; }
  .top { position: fixed; top: 1rem; right: 1.5rem; font-size: 0.85rem; color: #64748b; }
  .top a { color: #7c8cf8; text-decoration: none; margin-left: 1rem; }
</style>
</head>
<body>
  <div class="top">
    Olá, <strong>{{ usuario.username }}</strong>
    {% if usuario.is_admin %}<a href="/admin/">⚙ Admin</a>{% endif %}
    <a href="/logout/">Sair</a>
  </div>

  <h2>Escolha o banco de dados</h2>
  <div class="cards">
    {% for b in bancos %}
    <a class="banco-card" href="/banco/{{ b }}/">
      <span>🗄</span>
      {{ b }}
    </a>
    {% endfor %}
  </div>
</body>
</html>
